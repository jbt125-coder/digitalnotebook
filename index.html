<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161A22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Class Notebook">
<title>Class Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* the theme (chosen in the cog) sets these colors; see THEMES in the script */
:root{
  --sky:#161A22; --sky2:#1C212B; --panel:#222936; --panel2:#2A3242; --line:#39445A;
  --ice:#B8C7DD; --amber:#F2C14E; --ink:#1A1306; --text:#E8EEF5; --muted:#9AA8BA; --done:#86D4A9; --soft:#D5DDE8;
  --amberSoft:rgba(242,193,78,.1); --amberMark:rgba(242,193,78,.28); --iceSoft:rgba(184,199,221,.1); --glass:rgba(34,41,54,.8);
  --head:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--sky);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--sky);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--head);margin:0;line-height:1.15}
p{margin:0 0 .8em}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:8px}
.view{display:none}
.view.on{display:block}

/* Title */
#title{position:relative;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
#title.on{display:flex;flex-direction:column}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff}
.star.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.bit{position:absolute;color:var(--ice);font-family:var(--head);font-weight:600;line-height:1;white-space:nowrap}
.bit.fl{animation:fl 8s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.art{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;max-height:260px;pointer-events:none;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.title-inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(30vh + 24px);max-width:520px;width:100%;margin:0 auto}
.title-inner h1{font-weight:800;font-size:clamp(2.4rem,11vw,3.8rem);letter-spacing:-.02em;line-height:.98;margin-bottom:14px;overflow-wrap:anywhere}
.title-inner h1 span{display:block;font-weight:600;font-size:.52em;letter-spacing:0;color:var(--ice);margin-top:10px}
.lede{color:var(--muted);margin-bottom:26px}
.welcome{background:var(--glass);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:8px}
.welcome b{color:var(--amber)}
.welcome p:last-child{margin:0}
.picker{display:flex;gap:10px}
.select-wrap{position:relative;flex:1;min-width:0}
.select-wrap::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2px solid var(--ice);border-bottom:2px solid var(--ice);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{width:100%;appearance:none;-webkit-appearance:none;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 40px 14px 16px;font-size:17px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:700;cursor:pointer;background:var(--amber);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ice);border:1.5px solid var(--line)}
.btn.wide{width:100%;padding:16px;font-size:18px}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;cursor:pointer;font-size:15px}
.title-foot{position:relative;z-index:1;text-align:center;padding:0 12px 10px}
.title-foot .linkish,.title-foot .me-line{display:inline-block;background:var(--glass);border-radius:999px;padding:4px 12px;margin:2px;color:var(--soft)}
.title-foot .me-line:empty{display:none}

/* Page chrome */
.page{max-width:680px;margin:0 auto;padding:12px 20px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 18px}
.back{background:none;border:0;color:var(--ice);font-weight:700;padding:8px 4px;cursor:pointer;font-size:16px}
.back::before{content:"‹ ";font-size:1.2em}
.crumb{color:var(--muted);font-size:14px;text-align:right}

/* Contents */
.toc-head h2{font-size:clamp(1.9rem,8vw,2.6rem);font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.toc-head p{color:var(--muted);margin-top:6px}
.meter{height:6px;background:var(--panel);border-radius:6px;margin:16px 0 10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--done);border-radius:6px;transition:width .5s}
.hint{color:var(--muted);font-size:14px;margin:0 0 16px}
.toc{list-style:none;margin:0;padding:0;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.toc li{margin-bottom:12px;position:relative}
.toc li.lifted{z-index:5}
.toc li.lifted button{border-color:var(--amber);background:var(--panel2);box-shadow:0 14px 30px rgba(0,0,0,.45);transform:scale(1.02)}
.toc button{width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.toc svg{width:56px;height:56px;display:block}
.toc h3{font-size:1.15rem;font-weight:600}
.toc p{color:var(--muted);font-size:15px;margin:2px 0 0;line-height:1.4}
.status{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.status.done{color:var(--done)}
.reset-row{text-align:center;margin-top:6px}
body.dragging{cursor:grabbing}

/* Cards: a topic's cheat sheet */
.card h2{font-size:clamp(1.9rem,8vw,2.5rem);font-weight:800;letter-spacing:-.01em;margin-bottom:12px;overflow-wrap:anywhere}
.card h3{font-size:1.3rem;font-weight:600;margin:30px 0 10px;color:var(--ice)}
.card .intro{font-size:1.1rem}
.card-band{height:84px;border:1.5px solid var(--line);border-radius:22px;margin:0 0 22px;overflow:hidden;background:var(--sky2)}
.card-band svg{width:100%;height:100%;display:block}
mark{background:var(--amberMark);color:inherit;border-radius:5px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.facts{margin:8px 0;padding-left:22px}
.facts li{margin-bottom:8px}
.facts li::marker{color:var(--amber)}
.callout{background:var(--amberSoft);border-left:4px solid var(--amber);border-radius:4px 14px 14px 4px;padding:14px 16px;margin:16px 0}
.callout strong{color:var(--amber)}
.callout p:last-child{margin:0}
.defs{display:grid;gap:10px;margin:12px 0}
.def{background:var(--panel);border-radius:14px;padding:12px 14px}
.def b{color:var(--ice)}
.formula{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;margin:14px 0}
.formula .ftext{font-family:var(--head);font-size:1.3rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.flabel{display:inline-block;font-size:12.5px;font-weight:700;color:var(--ice);background:var(--iceSoft);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.example{background:var(--sky2);border:1.5px dashed var(--line);border-radius:16px;padding:12px 16px;margin:14px 0}
.example p{margin:0 0 6px}
.example ol{margin:4px 0 0;padding-left:22px}
.example li{margin-bottom:4px}
.example li::marker{color:var(--ice);font-weight:700}
.next-row{margin-top:34px}
.empty-sheet{color:var(--muted)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(4,10,18,.65);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.on{display:flex}
.sheet{background:var(--panel);border:1.5px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.sheet p{color:var(--soft)}
.sheet .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheet .row .btn{flex:1}
.count{font-family:var(--head);font-size:3rem;font-weight:800;color:var(--amber);line-height:1;margin:6px 0 4px}
.small{font-size:13px;color:var(--muted)}
.sheet.tall{max-height:calc(92vh - env(safe-area-inset-top,0px));max-height:calc(92dvh - env(safe-area-inset-top,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Cog, profile, games */
.cog{position:absolute;top:12px;right:12px;z-index:2;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;padding:0}
.cog svg{width:24px;height:24px}
.cog path{fill:var(--ice)}
.games-label{margin-top:22px}
.me-line{color:var(--muted);font-size:14px;margin:0 0 2px}
.field{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:700}
.inp{width:100%;background:var(--sky2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;color:var(--text)}
.inp.num{width:110px}
select.inp{padding-right:40px}
textarea.inp{min-height:150px;font-size:14px;line-height:1.4;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}
textarea.inp.notes{min-height:90px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--sky2);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ice);color:var(--sky);border-color:var(--ice)}
.qgroup{margin:16px 0 0}
.qgroup-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.qgroup-head b{font-family:var(--head);font-size:1.05rem}
.qgroup-head .linkish{padding:4px;font-size:14px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1.5px solid var(--line);background:var(--sky2);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;text-align:left;line-height:1.3}
.tchip small{color:var(--muted);font-size:12.5px;margin-left:4px}
.tchip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.tchip[aria-pressed="true"] small{color:inherit;opacity:.7}
.tchip:disabled{opacity:.4;cursor:default}
.msg{font-size:14px;margin:10px 0 0;color:var(--done)}
.msg.warn{color:var(--amber)}
.msg ul{margin:6px 0 0;padding-left:20px}
.steps{padding-left:20px;margin:6px 0 0;color:var(--soft)}
.steps li{margin-bottom:4px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:22px 0 4px}
[hidden]{display:none!important}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--amber)}
textarea.inp.link{min-height:0;height:90px;word-break:break-all}
.classbar{border:1.5px solid var(--amber);border-radius:14px;padding:10px 14px;margin:0 0 18px;font-size:14px;color:var(--text);background:var(--glass)}
.classbar b{color:var(--amber)}

/* Teacher settings (cog) */
.menu{display:grid;gap:10px;margin-top:14px}
.menu button{display:block;width:100%;text-align:left;background:var(--sky2);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.menu b{display:block;font-family:var(--head);font-size:1.1rem;font-weight:600}
.menu button:disabled{opacity:.45;cursor:default}
.menu span{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.theme{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;text-align:left;background:var(--sky2)}
.theme svg{display:block;width:100%;height:58px}
.theme span{display:block;padding:6px 10px 8px;font-size:14px;font-weight:700;line-height:1.25}
.theme[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.unit{background:var(--sky2);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.unit-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unit-head b{flex:1;min-width:120px;font-family:var(--head);font-size:1.1rem;font-weight:600;overflow-wrap:anywhere}
.trow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.unit-head + .trow{margin-top:8px}
.trow span{flex:1;min-width:120px;font-size:15px;overflow-wrap:anywhere}
.trow span small{display:block;color:var(--muted);font-size:12.5px}
.mini{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ice);line-height:1.2}
.mini:disabled{opacity:.35;cursor:default}
.mini.danger{color:var(--amber)}
.preview{background:var(--sky);border:1.5px solid var(--line);border-radius:16px;padding:6px 16px 10px;margin-top:10px;max-height:340px;overflow-y:auto}
.preview h3{font-size:1.1rem;margin:16px 0 6px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){.art{height:34vh}}
</style>
</head>
<body>

<section id="title" class="view" aria-labelledby="app-title">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <button class="cog" id="cogBtn" data-i18n-label="cogLabel" aria-label="Teacher settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 0-.5.4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5a.5.5 0 0 0 .6.2l2.5-1a7.3 7.3 0 0 0 1.7 1l.4 2.6a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1a.5.5 0 0 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button>
  <div class="title-inner">
    <div class="classbar" id="classBar" hidden></div>
    <h1 id="app-title"></h1>
    <p class="lede" data-i18n="lede">Study sheets and review games for each unit. Your progress saves on this device.</p>
    <div class="welcome" id="welcome" hidden></div>
    <div id="unitPick">
      <label for="unit" class="small" style="display:block;margin-bottom:6px" data-i18n="openUnit">Open a unit</label>
      <div class="picker">
        <div class="select-wrap"><select id="unit"></select></div>
        <button class="btn" id="openU" disabled data-i18n="open">Open</button>
      </div>
    </div>
    <div id="gamePick">
      <label for="game" class="small games-label" style="display:block;margin-bottom:6px" data-i18n="playGame">Play a review game</label>
      <div class="picker">
        <div class="select-wrap">
          <select id="game">
            <option value="" data-i18n="choose">Choose…</option>
            <option value="hoops" data-i18n="hoops">Basketball</option>
            <option value="derby" data-i18n="derby">Home Run Derby</option>
            <option value="paint" data-i18n="paint">Restore the Masters (painting)</option>
            <option value="snake" data-i18n="snake">Snake</option>
            <option value="blasteroids" data-i18n="blasteroids">Blasteroids</option>
            <option value="zombie" data-i18n="zombie">Zombie Horde</option>
          </select>
        </div>
        <button class="btn" id="playG" disabled data-i18n="play">Play</button>
      </div>
    </div>
  </div>
  <div class="title-foot"><p class="me-line" id="meLine"></p><button class="linkish" id="profileBtn" data-i18n="changeMe">Change name, period, or language</button> <button class="linkish" id="saveCheckBtn" data-i18n="saveCheck">Save check</button></div>
  <svg class="art" id="art" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
</section>

<section id="toc" class="view">
  <div class="page">
    <div class="topbar">
      <button class="back" data-go="" data-i18n="home">Home</button>
      <span class="crumb" id="tocCrumb"></span>
    </div>
    <div class="toc-head">
      <h2 id="tocTitle"></h2>
      <p id="tocProgress"></p>
    </div>
    <div class="meter" aria-hidden="true"><i id="meterFill" style="width:0"></i></div>
    <p class="hint" data-i18n="dragHint">Press and hold a topic, then drag to move it.</p>
    <ul class="toc" id="tocList"></ul>
    <div class="reset-row"><button class="linkish" id="resetOrder" hidden></button></div>
  </div>
</section>

<section id="cardView" class="view">
  <div class="page">
    <div class="topbar">
      <button class="back" id="cardBack" data-i18n="contents">Contents</button>
      <span class="crumb" id="cardCrumb"></span>
    </div>
    <article class="card" id="cardBody"></article>
    <div class="next-row">
      <button class="btn wide" id="nextBtn" data-i18n="next">Done, next topic</button>
    </div>
  </div>
</section>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================
   CLASS NOTEBOOK
   A blank notebook a teacher fills from the cog:
   - Title page: course name, teacher name, and a subject theme (cover art + colors)
   - Units: teacher-named groups, shown in the "Open a unit" menu
   - Topics: one AI-written cheat sheet each, pasted in from an AI chat
   - Review questions for the games, written by AI from the cheat sheets
   Everything the teacher makes is saved in this browser (COURSE_KEY).
   Students get it through a class link (made in the cog), which carries
   the course inside the link itself, so there's no server.
   ========================================================= */
const APP_VERSION = "1.0";
const SAVE_KEY = "digitalNotebook.save";       // the student's progress, profile, and game settings
const COURSE_KEY = "digitalNotebook.course";   // the teacher's course (title page, units, cheat sheets, questions)
const CLASS_KEY = "digitalNotebook.classLink"; // the class link a student opened
const LAUNCH_KEY = "digitalNotebook.launch";   // handed to the game pages
const SAVE_VERSION = 1;
let storageOK = true;

/* =========================================================
   SAVE SYSTEM  (student side)
   ========================================================= */
function blankSave(){ return { v: SAVE_VERSION, items: {}, order: {}, lastUnit: "", saveTest: 0, profile: null, game: {}, plays: 0 }; }
function migrate(d){
  if (!d || typeof d !== "object") return blankSave();
  d.items = d.items || {}; d.order = d.order || {};
  d.lastUnit = d.lastUnit || ""; d.saveTest = d.saveTest || 0;
  d.profile = d.profile || null; d.game = d.game || {}; d.plays = d.plays || 0;
  d.v = SAVE_VERSION;
  return d;
}
function loadSave(){ try { return migrate(JSON.parse(localStorage.getItem(SAVE_KEY))); } catch(e){ storageOK = false; return blankSave(); } }
function writeSave(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); storageOK = true; } catch(e){ storageOK = false; } }
let save = loadSave();
writeSave();

/* =========================================================
   LANGUAGE  (English / Español, chosen in the profile)
   ========================================================= */
const LANG = save.profile && save.profile.lang === "es" ? "es" : "en";
document.documentElement.lang = LANG;
function T(en, es){ return LANG === "es" ? es : en; }
const UI = {
  lede: ["Study sheets and review games for each unit. Your progress saves on this device.", "Hojas de estudio y juegos de repaso para cada unidad. Tu progreso se guarda en este aparato."],
  openUnit: ["Open a unit", "Abre una unidad"],
  choose: ["Choose…", "Elige…"],
  open: ["Open", "Abrir"], play: ["Play", "Jugar"],
  playGame: ["Play a review game", "Juega un juego de repaso"],
  hoops: ["Basketball", "Baloncesto"], derby: ["Home Run Derby", "Derby de jonrones"],
  paint: ["Restore the Masters (painting)", "Restaura las obras maestras (pintura)"],
  snake: ["Snake", "La serpiente"],

/* =========================================================
   CHEAT SHEETS
   The AI writes each topic's cheat sheet in this plain-text format
   (cheatPrompt below asks for it):
     Title: The water cycle
     Summary: one sentence for the contents list
     # Section title
     - A key fact with the **important words** in double stars
     Vocab: Term: a short definition          -> vocabulary cards
     Remember: a must-know idea                -> boxed callout
     Formula: A = l × w                        -> formula box
     Example: a worked problem                 -> example box...
     Step: one step of it                      -> ...with numbered steps
   Spanish labels (Título, Resumen, Vocabulario, Recuerda, Fórmula,
   Ejemplo, Paso) work too.
   ========================================================= */
const LABELS = [
  ["title", /^(?:title|t[ií]tulo)$/i], ["sum", /^(?:summary|resumen)$/i],
  ["vocab", /^(?:vocab|vocabulary|vocabulario|term|t[eé]rmino|key term|word)$/i],
  ["rem", /^(?:remember|recuerda|recuerde|key idea|idea clave|important|importante|must know)$/i],
  ["formula", /^(?:formula|f[oó]rmula|rule|regla|equation|ecuaci[oó]n)$/i],
  ["ex", /^(?:example|ejemplo|worked example)$/i], ["step", /^(?:step|paso)\s*\d*$/i]
];
function parseSheet(text){
  const out = { title: "", sum: "", blocks: [] };
  String(text || "").replace(/\r/g, "").split("\n").forEach(raw => {
    let ln = raw.trim();
    if (!ln || /^(```|~~~)/.test(ln) || /^[-*_]{3,}$/.test(ln)) return;
    if (/^#+\s*/.test(ln)){ const h = ln.replace(/^#+\s*/, "").replace(/\*\*/g, "").trim(); if (h) out.blocks.push({ k: "h", t: h }); return; }
    // "- **Vocab:** ..." or "**Vocab**: ..." -> "Vocab: ..."
    let bare = ln.replace(/^(?:[-*•]|\d+[.)])\s+(?=\**[A-Za-zÁÉÍÓÚáéíóúñ ]+\d*\**\s*:)/, "").replace(/^\*\*([^*:]+?)\s*:\s*\*\*\s*/, "$1: ").replace(/^\*\*([^*:]+?)\*\*\s*:\s*/, "$1: ");
    const m = bare.match(/^([A-Za-zÁÉÍÓÚáéíóúñ ]{2,20}?\d*)\s*:\s*(.*)$/);
    const lab = m && LABELS.find(l => l[1].test(m[1].trim()));
    if (lab){
      const k = lab[0], rest = m[2].trim();
      if (!rest) return;
      if (k === "title"){ if (!out.title) out.title = rest.replace(/\*\*/g, ""); return; }
      if (k === "sum"){ if (!out.sum) out.sum = rest.replace(/\*\*/g, ""); return; }
      if (k === "vocab"){
        const v = rest.replace(/^\*\*([^*]+)\*\*/, "$1").match(/^(.+?)\s*(?::|\s[-–—=]\s)\s*(.+)$/);
        out.blocks.push(v ? { k, term: v[1].replace(/\*\*/g, "").trim(), t: v[2] } : { k, term: rest.replace(/\*\*/g, ""), t: "" });
        return;
      }
      out.blocks.push({ k, t: rest }); return;
    }
    let b;
    if ((b = ln.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/))) out.blocks.push({ k: "li", t: b[1] });
    else if ((b = ln.match(/^>\s*(.*)$/))) out.blocks.push({ k: "rem", t: b[1] });
    else out.blocks.push({ k: "p", t: ln });
  });
  return out;
}
/* **highlight** -> <mark>, x^2 -> superscript */
function inl(t){
  return esc(t).split(/\*\*(.+?)\*\*/).map((s, i) => i % 2 ? `<mark>${s.replace(/\*/g, "")}</mark>` : s.replace(/\*\*/g, ""))
    .join("").replace(/\^(\d+|[a-zA-Z])(?![\w])/g, "<sup>$1</sup>");
}
function sheetHtml(text, lang){
  const t2 = (en, es) => (lang || LANG) === "es" ? es : en;
  const bl = parseSheet(text).blocks;
  let h = "", open = "";
  const close = () => { if (open) h += open === "ul" ? "</ul>" : open === "defs" ? "</div>" : "</ol></div>"; open = ""; };
  bl.forEach(b => {
    if (b.k === "li"){ if (open !== "ul"){ close(); h += `<ul class="facts">`; open = "ul"; } h += `<li>${inl(b.t)}</li>`; return; }
    if (b.k === "vocab"){ if (open !== "defs"){ close(); h += `<div class="defs">`; open = "defs"; } h += `<div class="def"><b>${inl(b.term)}</b>${b.t ? ": " + inl(b.t) : ""}</div>`; return; }
    if (b.k === "step"){
      if (open !== "ex"){ close(); h += `<div class="example"><span class="flabel">${t2("Steps", "Pasos")}</span><ol>`; open = "ex"; }
      h += `<li>${inl(b.t)}</li>`; return;
    }
    close();
    if (b.k === "h") h += `<h3>${inl(b.t)}</h3>`;
    else if (b.k === "rem") h += `<div class="callout"><p><strong>${t2("Remember:", "Recuerda:")}</strong> ${inl(b.t)}</p></div>`;
    else if (b.k === "formula") h += `<div class="formula"><span class="flabel">${t2("Formula", "Fórmula")}</span><div class="ftext">${inl(b.t)}</div></div>`;
    else if (b.k === "ex"){ h += `<div class="example"><span class="flabel">${t2("Example", "Ejemplo")}</span><p>${inl(b.t)}</p><ol>`; open = "ex"; }
    else h += `<p>${inl(b.t)}</p>`;
  });
  close();
  return h;
}
/* a cheat sheet as plain notes, for the review question prompt */
function sheetPlain(text){
  const s = parseSheet(text), lab = { rem: "Remember: ", formula: "Formula: ", ex: "Example: ", step: "  Step: " };
  return s.blocks.map(b => {
    const t = b.t.replace(/\*\*/g, "");
    return b.k === "h" ? "## " + t : b.k === "vocab" ? b.term + ": " + t : b.k === "li" ? "- " + t : (lab[b.k] || "") + t;
  }).join("\n");
}
function sheetStats(text){
  const s = parseSheet(text), n = k => s.blocks.filter(b => b.k === k).length;
  return { s, sections: n("h"), vocab: n("vocab"), rem: n("rem"), formula: n("formula"), ex: n("ex"), lines: s.blocks.length, marked: /\*\*[^*]+\*\*/.test(text) };
}

/* the AI prompt that writes a cheat sheet */
function cheatPrompt(o){

  const fmt = [
    `Title: ${o.title || "The topic's title"}`,

  if (o.rem) fmt.push("Remember: The one idea from this section students must not forget");
  if (o.formula) fmt.push("Formula: A formula or rule in plain text, then what each letter means", "Example: A short example problem", "Step: One step of the solution per line, ending with the answer");
  const rules = [
    `Use ${len}, each with 2 to 6 lines.`,
    "In EVERY line that starts with -, wrap 1 to 3 key words in **double stars**, for example:\n  - **Evaporation** turns liquid water into **water vapor**.",
    o.vocab && "Put the important vocabulary words on Vocab lines (Vocab: Term: definition), in the section where they belong. Leave out vocabulary a student at this level already knows.",
    o.rem && "Give each section at most one Remember line. Use Remember lines for the ideas most likely to be on a test and the mistakes students make most.",
    o.formula && "Use Formula lines for formulas, rules, and equations. Use an Example line followed by Step lines for each worked example. Write math in plain text (x^2, sqrt(x), ×, ÷, ≤): no LaTeX.",
    `Write for ${o.grade || "high school"} students: short, clear sentences that fit on a phone screen.`,
    "Start every line with one of the labels shown in the format (Title:, Summary:, #, -" + (o.vocab ? ", Vocab:" : "") + (o.rem ? ", Remember:" : "") + (o.formula ? ", Formula:, Example:, Step:" : "") + ").",
    "Plain text only: no tables, no emojis, no other markdown, and nothing before or after the cheat sheet. Put the whole cheat sheet in one code block so it is easy to copy."
  ].filter(Boolean);
  return `Make a study cheat sheet for students.

Topic: ${o.title || "(write the topic here)"}
${o.course ? `Class: ${o.course}\n` : ""}Grade level: ${o.grade || "high school"}
${o.notes ? `\nBase the cheat sheet on this material (keep its facts and vocabulary, leave out anything off topic):\n"""\n${o.notes}\n"""\n` : "\nCover the key ideas, vocabulary, and facts a student needs to know about this topic.\n"}
Use exactly this format:
${fmt.join("\n")}

Rules:
${rules.map(r => "- " + r).join("\n")}`;
}
function esSheetPrompt(text){

Keep exactly the same lines and format:
- Keep these labels in English, exactly as written, at the start of their lines: Title:, Summary:, Vocab:, Remember:, Formula:, Example:, Step:
- Translate everything after the labels. In Vocab lines keep the colon between the term and its definition.
- Keep # at the start of section titles and - at the start of fact lines.
- Wrap the same key words in **double stars** in Spanish.

- Put the whole answer in one code block, with nothing before or after it.

${text}`;

/* turn a formatted paste (from an AI chat or a document) into cheat sheet text: headings become #, bold becomes **highlight** */
function htmlToSheet(html){
  const doc = new DOMParser().parseFromString(html, "text/html"), out = [];
  const bold = n => { const fw = ((n.getAttribute("style") || "").match(/font-weight:\s*([a-z0-9]+)/i) || [])[1]; return fw ? /bold|[6-9]00/i.test(fw) : /^(B|STRONG|MARK)$/.test(n.tagName); };
  const tidy = t => t.replace(/\s+/g, " ").replace(/\s+([.,;:!?)])/g, "$1").trim();
  const inline = node => {
    let t = "";
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) t += n.nodeValue;
      else if (n.nodeType === 1){
        if (n.tagName === "BR") t += " ";
        else if (/^(UL|OL)$/.test(n.tagName)) return;
        else if (bold(n)){ const x = inline(n).replace(/\*\*/g, "").trim(); if (x) t += " **" + x + "** "; }
        else t += inline(n);
      }
    });
    return t;
  };
  const block = node => node.childNodes.forEach(n => {
    const tag = n.tagName; let x;
    if (n.nodeType === 3){ if (tidy(n.nodeValue)) out.push(tidy(n.nodeValue)); return; }
    if (n.nodeType !== 1 || /^(SCRIPT|STYLE|META)$/.test(tag)) return;
    if (tag === "PRE"){ out.push(n.textContent); return; }
    if (/^H[1-6]$/.test(tag)) out.push("# " + tidy(inline(n).replace(/\*\*/g, "")));
    else if (tag === "LI"){ out.push("- " + tidy(inline(n))); n.childNodes.forEach(c => { if (/^(UL|OL)$/.test(c.tagName || "")) block(c); }); }
    else if (/^(UL|OL|DIV|SECTION|ARTICLE|MAIN|BLOCKQUOTE|BODY|SPAN)$/.test(tag) || (tag === "B" && !bold(n))) block(n);
    else if ((x = tidy(inline(n)))){ const m = x.match(/^\*\*([^*]+)\*\*:?$/); out.push(m ? "# " + m[1] : x); }
  });
  block(doc.body);
  return out.join("\n");
}
/* pasting from an AI chat's page (not its copy button) brings formatting: keep the highlights */
function smartPaste(box, after){
  box.addEventListener("paste", e => {
    const cd = e.clipboardData; if (!cd) return;
    const plain = cd.getData("text/plain"), html = cd.getData("text/html");
    if (!html || /\*\*|^\s*#/m.test(plain) || !/<(b|strong|h[1-6]|li)\b/i.test(html)) return;
    e.preventDefault();
    const t = htmlToSheet(html), s = box.selectionStart, en = box.selectionEnd;
    box.value = box.value.slice(0, s) + t + box.value.slice(en);
    box.selectionStart = box.selectionEnd = s + t.length;
    after && after();
  });
}

/* =========================================================
   THE COURSE  (made in the cog; a class link carries a copy)
   { title, teacher, theme, grade, units: [{ id, name, tp: [topic ids] }],
     topics: { id: { title, sum, sheet, es: { title, sum, sheet } } },
     q: [review questions], pref: { cheat sheet prompt choices } }
   Topic and unit ids are permanent save keys for students' progress.
   ========================================================= */
function blankCourse(){ return { v: 1, title: "", teacher: "", theme: "plain", grade: "", units: [], topics: {}, q: [], pref: {} }; }
const str = (x, n) => typeof x === "string" ? x.slice(0, n) : "";
const okC = c => Array.isArray(c) && c.length >= 2 && c.every(x => typeof x === "string");
function checkQ(list, topics){
  return (Array.isArray(list) ? list : []).filter(x => x && topics[x.tp] && typeof x.q === "string" && okC(x.c) && x.a >= 0 && x.a < x.c.length)
    .map(x => { const o = { tp: x.tp, q: x.q, c: x.c, a: x.a }; if (x.es && typeof x.es.q === "string" && okC(x.es.c) && x.es.c.length === x.c.length) o.es = { q: x.es.q, c: x.es.c }; return o; });
}
function checkCourse(d){
  if (!d || typeof d !== "object") return null;
  const c = blankCourse();
  c.title = str(d.title, 60); c.teacher = str(d.teacher, 40); c.grade = str(d.grade, 40);
  c.theme = THEMES[d.theme] ? d.theme : "plain";
  c.pref = d.pref && typeof d.pref === "object" ? d.pref : {};
  const tps = d.topics && typeof d.topics === "object" ? d.topics : {};
  for (const id in tps){
    const t = tps[id];
    if (!/^[a-z0-9-]{1,40}$/.test(id) || !t || typeof t !== "object") continue;
    const o = { title: str(t.title, 80) || id, sum: str(t.sum, 240), sheet: str(t.sheet, 30000) };
    if (t.es && typeof t.es === "object" && (t.es.sheet || t.es.title)) o.es = { title: str(t.es.title, 80), sum: str(t.es.sum, 240), sheet: str(t.es.sheet, 30000) };
    c.topics[id] = o;
  }
  const seen = new Set();
  (Array.isArray(d.units) ? d.units : []).forEach(u => {
    if (!u || typeof u.id !== "string" || !/^u[a-z0-9]{1,12}$/.test(u.id) || c.units.some(x => x.id === u.id)) return;
    const tp = (Array.isArray(u.tp) ? u.tp : []).filter(id => c.topics[id] && !seen.has(id));
    tp.forEach(id => seen.add(id));
    c.units.push({ id: u.id, name: str(u.name, 50) || "Unit", tp });
  });
  for (const id in c.topics) if (!seen.has(id)) delete c.topics[id];   // a topic belongs to a unit
  c.q = checkQ(d.q, c.topics);
  return c;
}
function loadCourse(){ try { return checkCourse(JSON.parse(localStorage.getItem(COURSE_KEY))) || blankCourse(); } catch(e){ return blankCourse(); } }

/* the course on screen: the class link's on a student's device, otherwise the teacher's own */
function C(){ return CLASS ? CLASS.c : course; }
function unitOf(id){ return C().units.find(u => u.id === id); }
function topicL(id){ const t = C().topics[id]; return LANG === "es" && t.es && t.es.sheet ? Object.assign({}, t, { title: t.es.title || t.title, sum: t.es.sum || t.sum, sheet: t.es.sheet }) : t; }
function cardTitle(id){ return topicL(id).title; }
function hasTopics(u){ const x = unitOf(u); return !!(x && x.tp.length); }

function slug(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32) || "topic"; }
function newTopicId(title){ const b = slug(title); let id = b, n = 2; while (course.topics[id]) id = b + "-" + n++; return id; }
function newUnitId(){ let id; do id = "u" + Math.random().toString(36).slice(2, 7); while (course.units.some(u => u.id === id)); return id; }

function markDone(key){ save.items[key] = Object.assign(save.items[key] || {}, { viewed: true, at: Date.now() }); writeSave(); }
function isDone(key){ return !!(save.items[key] && save.items[key].viewed); }

/* Order: student's order if they made one, with any new teacher topics
   inserted right after the teacher's previous topic. */
function getOrder(u){
  const x = unitOf(u), teacher = x ? x.tp.filter(id => C().topics[id]) : [];
  const mine = save.order[u];
  if (!Array.isArray(mine)) return teacher;
  const result = mine.filter(id => teacher.includes(id));
  teacher.forEach((id, i) => {
    if (result.includes(id)) return;
    let pos = 0;
    for (let j = i - 1; j >= 0; j--) { const k = result.indexOf(teacher[j]); if (k >= 0) { pos = k + 1; break; } }
    result.splice(pos, 0, id);
  });
  return result;
}

/* =========================================================
   DRAG TO REORDER (press and hold, then drag)
   ========================================================= */
let drag = null, suppressClick = false;
const tocList = $("#tocList");

function startPress(li, x, y){
  cancelPress();
  drag = { li, x0: x, y0: y, y, active: false };
  drag.timer = setTimeout(activateDrag, 350);
}
function cancelPress(){ if (drag){ clearTimeout(drag.timer); if (!drag.active) drag = null; } }
function activateDrag(){
  if (!drag) return;
  drag.active = true;
  const r = drag.li.getBoundingClientRect();
  drag.grab = drag.y - r.top;
  drag.li.classList.add("lifted");
  document.body.classList.add("dragging");
  if (navigator.vibrate) navigator.vibrate(15);
  positionDrag();
  requestAnimationFrame(autoScroll);
}
function moveDrag(x, y, e){
  if (!drag) return;
  drag.y = y;
  if (!drag.active){ if (Math.hypot(x - drag.x0, y - drag.y0) > 10) cancelPress(); return; }
  if (e && e.cancelable) e.preventDefault();
  positionDrag();
}
function positionDrag(){
  const li = drag.li, target = drag.y - drag.grab, mid = drag.y;
  let before = null;
  for (const n of tocList.children){
    if (n === li) continue;
    const r = n.getBoundingClientRect();
    if (mid < r.top + r.height / 2){ before = n; break; }
  }
  if (before !== li.nextElementSibling) tocList.insertBefore(li, before);
  const natural = tocList.getBoundingClientRect().top + li.offsetTop;
  li.style.transform = `translateY(${target - natural}px)`;
}
function autoScroll(){
  if (!drag || !drag.active) return;
  const edge = 70;
  if (drag.y < edge) { window.scrollBy(0, -8); positionDrag(); }
  else if (drag.y > window.innerHeight - edge) { window.scrollBy(0, 8); positionDrag(); }
  requestAnimationFrame(autoScroll);
}
function endPress(){
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.active){
    drag.li.style.transform = "";
    drag.li.classList.remove("lifted");
    document.body.classList.remove("dragging");
    save.order[tocList.dataset.u] = [...tocList.children].map(n => n.dataset.id);
    writeSave();
    $("#resetOrder").hidden = false;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 400);
  }
  drag = null;
}
tocList.addEventListener("touchstart", e => { const li = e.target.closest("li"); if (li){ const t = e.touches[0]; startPress(li, t.clientX, t.clientY); } }, { passive: true });
tocList.addEventListener("mousedown", e => { if (e.button !== 0) return; const li = e.target.closest("li"); if (li) startPress(li, e.clientX, e.clientY); });
tocList.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (drag){ const t = e.touches[0]; moveDrag(t.clientX, t.clientY, e); } }, { passive: false });
document.addEventListener("mousemove", e => { if (drag) moveDrag(e.clientX, e.clientY, e); });
document.addEventListener("touchend", endPress);
document.addEventListener("touchcancel", endPress);
document.addEventListener("mouseup", endPress);
document.addEventListener("click", e => { if (suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

/* =========================================================
   REVIEW QUESTIONS
   Written by AI in the cog, from each topic's cheat sheet, in this format:
     Topic: water-cycle
     Question: ...   A: ...  B: ...  C: ...  D: ...   Answer: B
     Pregunta: ...   A: ...  B: ...  C: ...  D: ...   (same order)
   ========================================================= */
function normKey(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }
function findTopic(label){
  const tps = C().topics, tries = [label, label.split("(")[0], label.split(/\s[-–—]\s/)[0], label.split(":")[0]];
  for (const tr of tries){
    const k = normKey(tr); if (!k) continue;
    for (const id in tps){
      const t = tps[id];
      if (normKey(id) === k || normKey(t.title) === k || (t.es && normKey(t.es.title) === k)) return id;
    }
  }
  return null;
}
/* one language's part of a question: text, then A: B: C: D: choices, then an optional Answer: letter */
function parseSection(body){
  const ans = body.match(/(?:^|[\s,;])(?:correct\s+)?(?:answer|respuesta(?:\s+correcta)?)\s*[:.\-]?\s*\(?([A-E])\b/i);
  let a = -1;
  if (ans){ a = ans[1].toUpperCase().charCodeAt(0) - 65; body = body.slice(0, ans.index); }
  const re = /(^|[\s,;])([A-E])\s*[:.)]\s+/g, marks = [];
  let m;
  while ((m = re.exec(body))) if (m[2].charCodeAt(0) - 65 === marks.length) marks.push({ at: m.index + m[1].length, textAt: re.lastIndex });
  const tidy = x => x.replace(/\s+/g, " ").replace(/[\s,;]+$/, "").trim();
  const q = tidy(marks.length ? body.slice(0, marks[0].at) : body);
  const c = marks.map((mk, i) => tidy(body.slice(mk.textAt, i + 1 < marks.length ? marks[i + 1].at : body.length)));
  return { q, c, a };
}
function parseBank(text){
  const out = [], problems = [], unknown = [];
  let tp = null, label = "", cur = null;
  const finish = () => {
    if (!cur) return;
    const en = parseSection(cur.en), short = cur.en.trim().split("\n")[0].slice(0, 70);
    if (!cur.tp){ if (!cur.label) problems.push(short + T(" (no Topic: line)", " (falta la línea Topic:)")); }
    else if (!en.q || en.c.length < 2 || en.c.some(x => !x) || en.a < 0 || en.a >= en.c.length) problems.push(short);
    else {
      const q = { tp: cur.tp, q: en.q, c: en.c, a: en.a };
      if (cur.es != null){ const es = parseSection(cur.es); if (es.q && es.c.length === en.c.length && es.c.every(x => x)) q.es = { q: es.q, c: es.c }; }
      out.push(q);
    }
    cur = null;
  };
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  for (let line of lines){
    line = line.replace(/\*\*|__/g, "").replace(/\\([*_`#\[\]()\-.!>+~|?:])/g, "$1").replace(/^\s*(?:#+|>|[-*•])\s*/, "").replace(/^\s*\d+\s*[.)]\s+(?=(?:topic|tema|question|pregunta)\b)/i, "");
    let m;
    if ((m = line.match(/^\s*(?:topic|tema)\s*[:.\-]\s*(.+)$/i))){
      finish(); label = m[1].trim(); tp = findTopic(label);
      if (!tp && !unknown.includes(label)) unknown.push(label);
    } else if ((m = line.match(/^\s*(?:question|q)\s*\d*\s*[:.)\-]\s*(.*)$/i))){
      finish(); cur = { tp, label: tp ? "" : label, en: m[1], es: null };
    } else if ((m = line.match(/^\s*pregunta\s*\d*\s*[:.)\-]\s*(.*)$/i))){
      if (cur && cur.es == null) cur.es = m[1];
    } else if (cur){
      if (cur.es != null) cur.es += "\n" + line; else cur.en += "\n" + line;
    }
  }
  finish();
  return { questions: out, problems, unknown };
}
const qKey = q => q.tp + "|" + normKey(q.q);
function allQuestions(){ return C().q; }
function countsBy(list){ const n = {}; list.forEach(q => { n[q.tp] = (n[q.tp] || 0) + 1; }); return n; }

/* topic buttons, grouped by unit; tap to highlight */
function topicPicker(selected, counts, opt){
  const units = C().units;
  if (!units.some(u => u.tp.length)) return `<p class="small" style="margin:0">${T("No topics yet. Add cheat sheets first.", "Todavía no hay temas. Primero agrega hojas de estudio.")}</p>`;
  return units.filter(u => u.tp.length).map(u => {
    const ids = opt.student ? getOrder(u.id) : u.tp;
    const chips = ids.map(id => {
      const n = counts[id] || 0, off = opt.needQ && !n;
      return `<button type="button" class="tchip" data-tp="${id}" aria-pressed="${selected.has(id)}"${off ? " disabled" : ""}>${esc(cardTitle(id))}${opt.showCount ? `<small>${n}</small>` : ""}</button>`;
    }).join("");
    return `<div class="qgroup" data-u="${u.id}"><div class="qgroup-head"><b>${esc(u.name)}</b><button type="button" class="linkish" data-allu="${u.id}"></button></div><div class="tchips">${chips}</div></div>`;
  }).join("");
}
function bindPicker(root, selected, onChange){
  const chipsOf = u => [...root.querySelectorAll(`.qgroup[data-u="${u}"] .tchip:not(:disabled)`)];
  const refresh = () => {
    root.querySelectorAll("[data-allu]").forEach(b => {
      const chips = chipsOf(b.dataset.allu);
      b.textContent = chips.length && chips.every(x => selected.has(x.dataset.tp)) ? T("Clear", "Quitar") : T("Select all", "Elegir todos");
      b.hidden = !chips.length;
    });
    onChange();
  };
  root.addEventListener("click", e => {
    const c = e.target.closest(".tchip");
    if (c && !c.disabled){
      const id = c.dataset.tp;
      if (selected.has(id)) selected.delete(id); else selected.add(id);
      c.setAttribute("aria-pressed", selected.has(id));
      return refresh();
    }
    const a = e.target.closest("[data-allu]");
    if (a){
      const chips = chipsOf(a.dataset.allu), allOn = chips.every(x => selected.has(x.dataset.tp));
      chips.forEach(x => { if (allOn) selected.delete(x.dataset.tp); else selected.add(x.dataset.tp); x.setAttribute("aria-pressed", !allOn); });
      refresh();
    }
  });
  refresh();
}
function topicsInOrder(selected){ return C().units.flatMap(u => u.tp).filter(id => selected.has(id)); }

  const selected = new Set((last.topics || []).filter(id => counts[id]));
  openSheet(`<h3 id="sheetTitle">${sport === "derby" ? T("Home Run Derby", "Derby de jonrones") : sport === "paint" ? T("Restore the Masters", "Restaura las obras maestras") : sport === "snake" ? T("Snake", "La serpiente") : sport === "blasteroids" ? T("Blasteroids", "Blasteroids") : sport === "zombie" ? T("Zombie Horde", "La horda zombi") : T("Basketball", "Baloncesto")}</h3>
    <p>${sport === "derby" ? T("Answer 3 questions right to step up to bat. When time runs out, you get a score card.", "Contesta 3 preguntas bien para pasar al bate. Cuando se acabe el tiempo, verás tu tarjeta de puntaje.")

      : sport === "snake" ? T("Answer 3 questions right to start, then 3 more after every 2 levels and every time you crash. Beat all 6 levels and the evil snake comes out to race you. When time runs out, you get a score card.", "Contesta 3 preguntas bien para empezar, y 3 más cada 2 niveles y cada vez que choques. Pasa los 6 niveles y sale la serpiente malvada a echarte una carrera. Cuando se acabe el tiempo, verás tu tarjeta de puntaje.")
      : sport === "blasteroids" ? T("Answer 3 questions right before every wave as you fly through all 4 modes. Lose a ship? Answer 3 right to launch the next one. You get 3 ships, then it's back to wave 1. When time runs out, you get a score card.", "Contesta 3 preguntas bien antes de cada oleada mientras vuelas por los 4 modos. ¿Perdiste una nave? Contesta 3 bien para lanzar la siguiente. Tienes 3 naves, y después vuelves a la oleada 1. Cuando se acabe el tiempo, verás tu tarjeta de puntaje.")
      : sport === "zombie" ? T("Answer 3 questions right to send 3 men into wave 1. After every bonus round, answer up to 10 questions: each right answer is 1 man for the next wave. Lose your squad? Answer more to try the wave again. Stay above 40% correct or the zombies take over. When time runs out, you get a score card.", "Contesta 3 preguntas bien para mandar 3 soldados a la oleada 1. Después de cada ronda de bonificación, contesta hasta 10 preguntas: cada respuesta correcta es 1 soldado para la siguiente oleada. ¿Perdiste tu escuadrón? Contesta más para intentar la oleada otra vez. Mantente arriba del 40% correcto o los zombis se apoderan del mundo. Cuando se acabe el tiempo, verás tu tarjeta de puntaje.")
      : T("Answer 3 questions right to earn 3 balls. When time runs out, you get a score card.", "Contesta 3 preguntas bien para ganar 3 balones. Cuando se acabe el tiempo, verás tu tarjeta de puntaje.")}</p>
    <label class="field" for="gMins">${T("How many minutes do you want to play?", "¿Cuántos minutos quieres jugar?")}</label>
    <input class="inp num" id="gMins" type="number" inputmode="numeric" min="1" max="60" value="${last.mins || 5}">
    <span class="field">${T("Which topics do you want to review?", "¿Qué temas quieres repasar?")}</span>
    <div id="gPick">${topicPicker(selected, counts, { needQ: true, showCount: false, student: true })}</div>
    <p class="msg" id="gMsg"></p>
    <div class="row"><button class="btn" id="gGo">${T("Play", "Jugar")}</button><button class="btn ghost" data-close>${T("Cancel", "Cancelar")}</button></div>`, { tall: true });
  bindPicker($("#gPick"), selected, () => {
    const n = [...selected].reduce((a, id) => a + (counts[id] || 0), 0);
    $("#gGo").disabled = !n;
    $("#gMsg").className = "msg" + (n ? "" : " warn");
    $("#gMsg").textContent = n ? T(`${selected.size} ${selected.size === 1 ? "topic" : "topics"}, ${n} questions`, `${selected.size} ${selected.size === 1 ? "tema" : "temas"}, ${n} preguntas`)
      : T("Tap the topics you want to review.", "Toca los temas que quieres repasar.");
  });
  $("#gGo").addEventListener("click", () => {
    const mins = Math.min(60, Math.max(1, parseInt($("#gMins").value, 10) || 5));
    const ids = topicsInOrder(selected);
    save.plays = (save.plays || 0) + 1;
    save.game = Object.assign(save.game || {}, { mins, topics: ids }); writeSave();
    const p = save.profile || {};
    const data = {
      v: 1, s: sport, m: mins, lang: LANG, name: fullName(p), first: p.first || "", per: p.per || "", course: courseTitle(),
      topics: ids.map(id => ({ id, name: cardTitle(id) })),
      q: allQuestions().filter(q => ids.includes(q.tp))
    };
    if (save.plays % 3 === 0){ data.gold = GOLDEN[(save.plays / 3 - 1) % GOLDEN.length]; data.goldAt = 2 + Math.floor(Math.random() * 3); }
    try { localStorage.setItem(LAUNCH_KEY, JSON.stringify(data)); }
    catch(e){ $("#gMsg").className = "msg warn"; $("#gMsg").textContent = T("This browser won’t let the game start. Try Safari or Chrome.", "Este navegador no deja empezar el juego. Prueba Safari o Chrome."); return; }
    location.href = sport === "paint" ? "paint.html#ess" : sport === "snake" ? "snake.html#ess" : sport === "blasteroids" ? "blasteroids.html#ess" : sport === "zombie" ? "zombie.html#ess" : "games.html#ess";
  });
}

/* ---- units and topics ---- */
function unitsSheet(){
  const c = course;
  const unitHtml = (u, i) => `<div class="unit" data-u="${u.id}">
      <div class="unit-head"><b>${esc(u.name)}</b>
        <button class="mini" data-act="uup" ${i ? "" : "disabled"} aria-label="${T("Move up", "Subir")}">↑</button><button class="mini" data-act="udown" ${i < c.units.length - 1 ? "" : "disabled"} aria-label="${T("Move down", "Bajar")}">↓</button>
        <button class="mini" data-act="uren">${T("Rename", "Renombrar")}</button><button class="mini danger" data-act="udel">${T("Delete", "Borrar")}</button></div>
      ${u.tp.map((id, j) => { const t = c.topics[id], n = c.q.filter(q => q.tp === id).length; return `<div class="trow" data-tp="${id}"><span>${esc(t.title)}<small>${T(`${n} questions`, `${n} preguntas`)}${t.es && t.es.sheet ? " · Español ✓" : ""}</small></span>
        <button class="mini" data-act="tup" ${j ? "" : "disabled"} aria-label="${T("Move up", "Subir")}">↑</button><button class="mini" data-act="tdown" ${j < u.tp.length - 1 ? "" : "disabled"} aria-label="${T("Move down", "Bajar")}">↓</button>
        <button class="mini" data-act="tedit">${T("Edit", "Editar")}</button></div>`; }).join("")}
      <div class="row" style="margin-top:10px"><button class="btn ghost" data-act="tadd">+ ${T("Add a cheat sheet", "Agregar una hoja de estudio")}</button></div>
    </div>`;
  openSheet(`<h3 id="sheetTitle">${T("Units and cheat sheets", "Unidades y hojas de estudio")}</h3>
    <p>${T("Units show in the <b>Open a unit</b> menu. Each cheat sheet you add becomes a topic in its unit.", "Las unidades salen en el menú <b>Abre una unidad</b>. Cada hoja de estudio que agregues es un tema de su unidad.")}</p>
    <div id="uList">${c.units.map(unitHtml).join("") || `<p class="small">${T("No units yet.", "Todavía no hay unidades.")}</p>`}</div>
    <label class="field" for="uName">${T("New unit name", "Nombre de la unidad nueva")}</label>
    <div class="picker"><input class="inp" id="uName" maxlength="50" placeholder="${T(`Unit ${c.units.length + 1}: …`, `Unidad ${c.units.length + 1}: …`)}"><button class="btn" id="uAdd">${T("Add unit", "Agregar")}</button></div>
    <p class="msg" id="uMsg"></p>
    ${backRow()}`, { tall: true });
  bindBack(cogSheet);
  const add = () => {
    const name = $("#uName").value.trim().slice(0, 50) || T(`Unit ${c.units.length + 1}`, `Unidad ${c.units.length + 1}`);
    c.units.push({ id: newUnitId(), name, tp: [] }); saved(); unitsSheet();
    const box = $("#sheet"); box.scrollTop = box.scrollHeight;
  };
  $("#uAdd").addEventListener("click", add);
  $("#uName").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  const move = (list, i, d) => { const j = i + d; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; };
  $("#uList").addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const ue = b.closest(".unit"), u = c.units.find(x => x.id === ue.dataset.u), ui = c.units.indexOf(u);
    const te = b.closest(".trow"), tid = te && te.dataset.tp, act = b.dataset.act;
    const keepScroll = () => { const s = $("#sheet").scrollTop; unitsSheet(); $("#sheet").scrollTop = s; };
    if (act === "uup" || act === "udown"){ move(c.units, ui, act === "uup" ? -1 : 1); saved(); return keepScroll(); }
    if (act === "tup" || act === "tdown"){ move(u.tp, u.tp.indexOf(tid), act === "tup" ? -1 : 1); saved(); return keepScroll(); }
    if (act === "tedit") return topicSheet(tid);
    if (act === "tadd") return topicSheet(null, u.id);
    if (act === "uren"){
      const head = ue.querySelector(".unit-head");
      head.innerHTML = `<input class="inp" maxlength="50" value="${esc(u.name)}" style="flex:1;min-width:150px"><button class="mini" data-act="usave">${T("Save", "Guardar")}</button>`;
      const inp = head.querySelector("input"); inp.focus(); inp.select();
      inp.addEventListener("keydown", ev => { if (ev.key === "Enter") head.querySelector("[data-act=usave]").click(); });
      return;
    }
    if (act === "usave"){ u.name = ue.querySelector(".unit-head input").value.trim().slice(0, 50) || u.name; saved(); return keepScroll(); }
    if (act === "udel"){
      if (b.dataset.armed){
        u.tp.forEach(id => delete c.topics[id]);
        c.q = c.q.filter(q => c.topics[q.tp]);
        c.units.splice(ui, 1); saved(); return keepScroll();
      }
      b.dataset.armed = 1;
      b.textContent = u.tp.length ? T(`Tap again: deletes ${u.tp.length} topics too`, `Toca otra vez: borra ${u.tp.length} temas también`) : T("Tap again to delete", "Toca otra vez para borrar");
      setTimeout(() => { delete b.dataset.armed; b.textContent = T("Delete", "Borrar"); }, 4000);
    }
  });
}

/* ---- review questions, written by AI from the cheat sheets ---- */
function aiPrompt(ids, per){
  const c = course;
  return `You are writing multiple-choice review questions for ${c.grade ? c.grade + " " : ""}students in ${c.title ? `a ${c.title} class` : "a class"}. The students' cheat sheet for each topic is at the end of this message. Base every question on those cheat sheets.

Write ${per} questions for EACH of these ${ids.length} topics (${per * ids.length} questions in all):
${ids.map(id => `- ${id}: ${c.topics[id].title}`).join("\n")}

Rules:
- Start every question with a Topic line that uses the exact topic label from the list above (the part before the colon).
- Each question has exactly 4 answer choices (A, B, C, D) and exactly one correct answer.
- Mix easy, medium, and hard questions. Include some that ask students to apply an idea, not just remember a word. Ask about the vocabulary, "Remember" ideas, and formulas on the cheat sheets.
- Spread the correct answers evenly across A, B, C, and D.
- No "all of the above" or "none of the above".
- Keep questions and choices short enough to read on a phone.
- After each English question, write the same question in Spanish, with the choices in the SAME order.
- Use plain text only: no bold, no numbering, no bullet points, no headings, and no extra comments. Put a blank line between questions.

Example of the format (use it for every question):

Topic: ${ids[0]}
Question: Which process turns liquid water into water vapor?
A: Condensation
B: Evaporation
C: Precipitation
D: Infiltration
Answer: B
Pregunta: ¿Qué proceso convierte el agua líquida en vapor de agua?
A: Condensación
B: Evaporación
C: Precipitación
D: Infiltración

If you run out of room, stop after a complete question. I will type "continue" and you keep going from where you stopped, in the same format.

CHEAT SHEETS
${ids.map(id => `=== ${id}: ${c.topics[id].title} ===\n${sheetPlain(c.topics[id].sheet)}`).join("\n\n")}`;
}

/* =========================================================
   CLASS LINK  (made from the cog)
   The link carries the course itself (title page, chosen topics with their
   cheat sheets, and their questions), like Quiz Quest's solo practice
   link, so there's no server. The student's device keeps the class link
   (and hides the cog) until they open a different class link. To get the
   cog back on a device, open the notebook with #teacher at the end of its
   address.
   ========================================================= */
/* link text: "z" + deflated JSON, or "j" + plain JSON where the browser can't compress; both base64url */
function b64url(bytes){
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(t){
  t = t.replace(/-/g, "+").replace(/_/g, "/");
  while (t.length % 4) t += "=";
  const bin = atob(t), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function packLink(obj, cb){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (!window.CompressionStream) return cb("j" + b64url(bytes));
  new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()
    .then(buf => cb("z" + b64url(new Uint8Array(buf))), () => cb("j" + b64url(bytes)));
}
function unpackLink(t, cb){
  try {
    const bytes = unb64url(t.slice(1));
    if (t[0] === "j") return cb(JSON.parse(new TextDecoder().decode(bytes)));
    if (t[0] !== "z" || !window.DecompressionStream) return cb(null);
    new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()
      .then(txt => { try { cb(JSON.parse(txt)); } catch(e){ cb(null); } }, () => cb(null));
  } catch(e){ cb(null); }
}

const sel = $("#unit"), openBtn = $("#openU");
sel.addEventListener("change", () => { openBtn.disabled = !sel.value; });
openBtn.addEventListener("click", () => {
  const u = sel.value; if (!u) return;
  save.lastUnit = u; writeSave();
  go(u);
});
$("#saveCheckBtn").addEventListener("click", saveCheck);
$("#profileBtn").addEventListener("click", () => profileSheet(false));
$("#cogBtn").addEventListener("click", cogSheet);
const gameSel = $("#game"), playBtn = $("#playG");
gameSel.addEventListener("change", () => { playBtn.disabled = !gameSel.value; if (gameSel.value) gameSheet(gameSel.value); });
playBtn.addEventListener("click", () => { if (gameSel.value) gameSheet(gameSel.value); });
document.addEventListener("click", e => {
  const card = e.target.closest("[data-card]");
  if (card) return go(currentU + "/" + card.dataset.card);
  const back = e.target.closest("[data-go]");
  if (back) return go(back.dataset.go);
});
$("#nextBtn").addEventListener("click", () => {
  if (currentCard) markDone(currentU + "." + currentCard);
  const order = getOrder(currentU), next = order[order.indexOf(currentCard) + 1];
  go(next ? currentU + "/" + next : currentU);
});
window.addEventListener("hashchange", route);

applyUI();
renderMeLine();
loadClass();
(function start(){
  const m = location.hash.match(/^#class=(.+)$/);
  const ready = bad => {
    route();
    if (CLASS && !save.profile) profileSheet(true);
    else if (bad) openSheet(`<h3 id="sheetTitle">${T("Link not working", "El enlace no funciona")}</h3><p>${T("This class link didn’t open. It may have been cut off when it was copied. Ask your teacher for the link again.", "Este enlace de clase no se abrió. Puede que se haya cortado al copiarlo. Pídele el enlace otra vez a tu maestro.")}</p><div class="row"><button class="btn" data-close>OK</button></div>`);
  };
  if (location.hash === "#teacher"){   // teacher's way out of a class link on their own device
    try { localStorage.removeItem(CLASS_KEY); } catch(e){}
    CLASS = null; history.replaceState(null, "", location.href.split("#")[0]);
  }
  if (!m) return ready(false);
  unpackLink(m[1], d => {
    const c = checkClass(d);
    if (c){ CLASS = c; try { localStorage.setItem(CLASS_KEY, JSON.stringify(c)); } catch(e){} }
    history.replaceState(null, "", location.href.split("#")[0]);
    ready(!c);
  });
})();
</script>
</body>
</html>
